version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-gustavo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - /var/www/porsche-911/dist:/usr/share/nginx/html/porsche:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
