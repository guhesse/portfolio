<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="<%- themeColor %>">
  <script>
    try {
      document.documentElement.style.colorScheme = "light"
    } catch (e) {}
    document.documentElement.classList.remove("dark")
  </script>
  <meta name="description" content="<%- description %>">
  <link rel="canonical" href="https://gustavohesse.com.br/">
  <link rel="alternate" hreflang="pt-BR" href="https://gustavohesse.com.br/">
  <link rel="alternate" hreflang="en" href="https://gustavohesse.com.br/en">
  <link rel="alternate" hreflang="x-default" href="https://gustavohesse.com.br/">
  <link rel="ard" href="/.well-known/ard.json">
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/gdc3nui.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://use.typekit.net/gdc3nui.css"></noscript>
  <!-- Meta Tags Open Graph -->
  <meta property="og:author" content="Gustavo Hesse">
  <meta property="og:title" content="<%- ogTitle %>">
  <meta property="og:description" content="<%- ogDescription %>">
  <meta name="image" property="og:image" content="<%- ogImage %>">
  <meta property="og:url" content="<%- ogUrl %>">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gustavo Hesse Portfolio">
  <!-- Meta Tags Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="<%- twitterTitle %>">
  <meta name="twitter:description" content="<%- twitterDescription %>">
  <meta name="twitter:image" content="<%- twitterImage %>">
  <title><%- title %></title>

  <!-- Google Analytics: a fila começa na hora, o script só depois da primeira pintura -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-C92MBMCXNL');
    window.addEventListener('load', function () {
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-C92MBMCXNL';
      document.head.appendChild(script);
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
