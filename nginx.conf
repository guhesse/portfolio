map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name gustavohesse.com.br www.gustavohesse.com.br _;
    return 301 https://$host$request_uri;
}

# Redirect meet subdomain to Calendly (HTTP)
server {
    listen 80;
    server_name meet.gustavohesse.com.br;
    return 301 https://calendly.com/hesse-gustavo/30min;
}

# HTTPS - Site principal
server {
    listen 443 ssl default_server;
    server_name gustavohesse.com.br www.gustavohesse.com.br;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Adgile app - URL limpa /adgile -> arquivos em /adgile/
    location /adgile {
        alias /usr/share/nginx/html/adgile;
        index index.html;
        try_files $uri $uri/ /adgile/index.html;
    }

    location /adgile/ {
        alias /usr/share/nginx/html/adgile/;
        index index.html;
        try_files $uri $uri/index.html /adgile/index.html;
    }

    # Coliseu - experiência WebGL em /coliseu/
    location /coliseu {
        alias /usr/share/nginx/html/coliseu;
        index index.html;
        try_files $uri $uri/ /coliseu/index.html;
    }

    location /coliseu/ {
        alias /usr/share/nginx/html/coliseu/;
        index index.html;
        try_files $uri $uri/index.html /coliseu/index.html;
    }

    # Porsche - experiência WebGL em /porsche/
    location /porsche {
        alias /usr/share/nginx/html/porsche;
        index index.html;
        try_files $uri $uri/ /porsche/index.html;
    }

    location /porsche/ {
        alias /usr/share/nginx/html/porsche/;
        index index.html;
        try_files $uri $uri/index.html /porsche/index.html;
    }

    # Pátio. Sem link no menu. O contentor patio atende na rede do compose.
    location = /patio {
        return 301 /patio/;
    }

    location ^~ /patio/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $patio_upstream patio:5217;
        proxy_pass http://$patio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 32m;
    }

    location ^~ /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pixel_upstream patio:3100;
        proxy_pass http://$pixel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /terminal/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pixel_terminal patio:3100;
        proxy_pass http://$pixel_terminal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback - all routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# HTTPS - Redirect meet subdomain to Calendly
server {
    listen 443 ssl;
    server_name meet.gustavohesse.com.br;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    return 301 https://calendly.com/hesse-gustavo/30min;
}